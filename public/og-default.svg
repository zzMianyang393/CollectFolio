<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Logo block -->
  <g transform="translate(80, 80)">
    <rect width="48" height="48" rx="10" fill="#fbbf24"/>
    <path d="M12 18h24M12 25h18M12 32h12" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <text x="148" y="118" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#fafafa" letter-spacing="-0.5">CollectFolio</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="Inter, sans-serif" font-size="84" font-weight="800" fill="#fafafa" letter-spacing="-2">
    <tspan x="80" dy="0">Your collection.</tspan>
    <tspan x="80" dy="100" fill="#fbbf24">Your portfolio.</tspan>
  </text>

  <!-- Subhead -->
  <text x="80" y="540" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#a3a3a3">
    Track Pokemon cards, LEGO, watches, and vinyl in one place.
  </text>

  <!-- Stat strip at bottom -->
  <g transform="translate(80, 580)">
    <text font-family="ui-monospace, monospace" font-size="20" fill="#fbbf24" font-weight="700">
      <tspan x="0">$17,790</tspan>
      <tspan x="200" fill="#fafafa">+34%</tspan>
      <tspan x="380" fill="#a3a3a3">149 items</tspan>
      <tspan x="600" fill="#a3a3a3">4 categories</tspan>
    </text>
  </g>

  <!-- Right-side decorative dots -->
  <g transform="translate(1050, 540)" opacity="0.6">
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
    <circle cx="20" cy="0" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="40" cy="0" r="3" fill="#fbbf24" opacity="0.3"/>
  </g>
</svg>